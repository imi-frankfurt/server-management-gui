version: '3.9'
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imi-frontend
    ports:
      - "3000:3000"
    environment:
      # Server-side backend URL used by Nuxt BFF server routes
      NUXT_API_BASE_URL: https://host.docker.internal:5000
      # Keep empty so browser does not bypass BFF
      NUXT_PUBLIC_API_BASE_URL: ""
      # Trust mkcert root CA in Node.js (for self-signed backend cert)
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/mkcert-rootCA.pem
    volumes:
      # Put mkcert root CA at ./.cert/rootCA.pem (same path works on Windows/Linux/macOS)
      - ./.cert/rootCA.pem:/etc/ssl/certs/mkcert-rootCA.pem:ro
    # Required on Linux so host.docker.internal resolves correctly.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
