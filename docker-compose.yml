version: '3.9'
services:
  frontend:
    image: ${FRONTEND_IMAGE:-imi-frontend:1.0}
    container_name: imi-frontend
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    environment:
      # Backend URL used by Nuxt server routes inside the container.
      # Points to API container on the shared Docker network (or subdomain in prod).
      NUXT_API_BASE_URL: ${NUXT_API_BASE_URL:-http://192.168.212.2:5000}
      # Keep empty so browser calls always stay on same-origin (/api via Nuxt BFF).
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-}
      # Keycloak account console linked from the sidebar.
      NUXT_PUBLIC_KEYCLOAK_BASE_URL: ${NUXT_PUBLIC_KEYCLOAK_BASE_URL:-https://login.imi-frankfurt.de/realms/imi/account}
    restart: unless-stopped
    networks:
      default:
        ipv4_address: ${FRONTEND_IP:-192.168.212.10}

networks:
  default:
    external: true
    name: imi-network
